version: '3.8'

services:
  # 1. NGINX REVERSE PROXY & LOAD BALANCER
  nginx:
    image: nginx:alpine
    container_name: kiran_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - kong
    restart: unless-stopped

  # 2. KONG API GATEWAY
  kong:
    image: kong:3.6-alpine
    container_name: kiran_kong_gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    restart: unless-stopped

  # 3. APACHE KAFKA & ZOOKEEPER EVENT STREAMING
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: kiran_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kiran_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: unless-stopped

  # 4. JAEGER DISTRIBUTED TRACING
  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: kiran_jaeger
    ports:
      - "16686:16686" # Web UI
      - "14268:14268" # Collector HTTP
      - "6831:6831/udp" # Agent compact thrift
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    restart: unless-stopped

  # 5. PROMETHEUS METRICS SCRAPER
  prometheus:
    image: prom/prometheus:latest
    container_name: kiran_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
    restart: unless-stopped

  # 6. GRAFANA DASHBOARD & VISUALIZATION
  grafana:
    image: grafana/grafana:latest
    container_name: kiran_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  # 7. BACKEND API SERVICE (EXPRESS + SOCKET.IO + JAEGER + KAFKA)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kiran_backend
    environment:
      PORT: 5000
      NODE_ENV: production
      KAFKA_BROKERS: "kafka:29092"
      JAEGER_ENDPOINT: "http://jaeger:14268/api/traces"
    ports:
      - "5000:5000"
    restart: unless-stopped
