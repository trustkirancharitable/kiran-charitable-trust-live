_format_version: "3.0"
_transform: true

services:
  - name: kiran-backend-api
    url: http://backend:5000/api
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      - name: api-routes
        paths:
          - /api
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 120
          policy: local
          fault_tolerant: true
      - name: cors
        config:
          origins:
            - "http://localhost:5173"
            - "https://kiran-trust-frontend-live.vercel.app"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - Authorization
            - X-Trace-ID
            - X-Turnstile-Token
          credentials: true
      - name: correlation-id
        config:
          header_name: X-Trace-ID
          generator: uuid#counter
          echo_downstream: true
      - name: prometheus
        config:
          status_code_metrics: true
          latency_metrics: true
          bandwidth_metrics: true

  - name: kiran-socket-io
    url: http://backend:5000/socket.io
    routes:
      - name: socketio-route
        paths:
          - /socket.io
        strip_path: false

  - name: kiran-metrics
    url: http://backend:5000/metrics
    routes:
      - name: metrics-route
        paths:
          - /metrics
        strip_path: false

  - name: kiran-frontend-ui
    url: http://frontend:5173
    routes:
      - name: frontend-routes
        paths:
          - /
        strip_path: false

upstreams:
  - name: kiran-backend-upstream
    algorithm: round-robin
    slots: 100
    healthchecks:
      active:
        healthy:
          interval: 5
          successes: 2
          http_statuses: [200, 302]
        unhealthy:
          interval: 2
          http_failures: 3
          http_statuses: [500, 502, 503]
        http_path: /api/health
        type: http
      passive:
        healthy:
          successes: 3
          http_statuses: [200, 201, 204]
        unhealthy:
          http_failures: 5
          http_statuses: [500, 502, 503, 504]
        type: http
    targets:
      - target: 127.0.0.1:5000
        weight: 100
