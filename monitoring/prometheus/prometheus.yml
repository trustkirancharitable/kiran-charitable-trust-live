global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "kiran-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:5000", "host.docker.internal:5000"]

  - job_name: "kong-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["kong:8001"]
